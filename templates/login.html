{% extends 'base.html' %} {% block title %} Login {% endblock title %} {% block
content %}
<div class="form_container">
  <form method="post">
    <div class="input">
      <input
        type="email"
        required
        placeholder="Enter Email"
        name="email"
        minlength="12"
      />
      <input
        type="password"
        required
        minlength="5"
        placeholder="Enter password"
        name="password"
      />
    </div>

    <button class="btn" type="submit">Submit</button>
  </form>

  {% if error %}
  <s>{{error}}</s>
  {% endif %}
</div>
{% endblock content %}
