{% extends 'base.html' %} {% block title %} register {% endblock title %} {%
block content %}
<div class="form_container">
  <form method="post">
    <div class="input">
      <input
        type="text"
        name="name"
        required
        placeholder="Enter Student Name"
        minlength="4"
      />
    </div>


    <div class="input">
      <input
        type="number"
        name="age"
        required
        placeholder="Enter Age"
        min="18"
      />
    </div>

    <div class="input">
      <input
        type="number"
        min="100"
        name="level"
        required
        placeholder="Enter Level 100-400"
        value="100"
      />
    </div>
    <button type="submit">Submit</button>
  </form>
  {% if error %}
  <s>{{error}}</s>
  {% endif %}
</div>
{% endblock content %}
